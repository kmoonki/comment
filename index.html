<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>실시간 방명록</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 antialiased">

  <div class="max-w-2xl mx-auto px-4 py-12">
    <!-- 헤더 -->
    <header class="text-center mb-10">
      <h1 class="text-3xl font-extrabold tracking-tight text-slate-900 sm:text-4xl">
        📖 실시간 방명록
      </h1>
      <p class="mt-2 text-slate-600">방문 흔적을 자유롭게 남겨주세요.</p>
    </header>

    <!-- 입력 폼 카드 -->
    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 mb-10">
      <form id="guestbook-form" class="space-y-4">
        <div>
          <label for="author" class="block text-sm font-semibold text-slate-700 mb-1">작성자 / 닉네임</label>
          <input 
            type="text" 
            id="author" 
            required 
            placeholder="이름 또는 닉네임을 입력하세요" 
            class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-sm transition"
          >
        </div>

        <div>
          <label for="message" class="block text-sm font-semibold text-slate-700 mb-1">남길 메시지</label>
          <textarea 
            id="message" 
            rows="3" 
            required 
            placeholder="따뜻한 한 마디를 적어주세요 :)" 
            class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-sm transition resize-none"
          ></textarea>
        </div>

        <button 
          type="submit" 
          id="submit-btn"
          class="w-full py-3 px-4 bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded-lg shadow-sm transition duration-150 flex items-center justify-center gap-2 cursor-pointer disabled:opacity-50"
        >
          <span>방명록 남기기</span>
        </button>
      </form>
    </div>

    <!-- 방명록 목록 섹션 -->
    <section>
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-lg font-bold text-slate-900 flex items-center gap-2">
          최근 메시지 <span id="count" class="text-xs px-2 py-0.5 rounded-full bg-slate-200 text-slate-700 font-semibold">0</span>
        </h2>
        <button 
          id="refresh-btn" 
          class="text-sm text-indigo-600 hover:text-indigo-800 font-medium inline-flex items-center gap-1 cursor-pointer"
        >
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
          </svg>
          새로고침
        </button>
      </div>

      <!-- 로딩 / 빈 상태 / 메시지 리스트 -->
      <div id="guestbook-list" class="space-y-3">
        <!-- 동적으로 카드 렌더링 -->
      </div>
    </section>
  </div>

  <script>
    // ⚠️ 1단계에서 복사한 GAS 웹 앱 URL을 아래에 입력하세요.
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbwCX7fRVkY0oVQPPpVGRk_ZGXBZeu1Sn914Dej7vj9r4AgP3scTwdeh7ekV_P7Bi1hOZw/exec";

    const form = document.getElementById("guestbook-form");
    const authorInput = document.getElementById("author");
    const messageInput = document.getElementById("message");
    const submitBtn = document.getElementById("submit-btn");
    const listContainer = document.getElementById("guestbook-list");
    const countBadge = document.getElementById("count");
    const refreshBtn = document.getElementById("refresh-btn");

    // XSS 방지용 문자열 이스케이프 함수
    function escapeHtml(text) {
      const map = {
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#039;'
      };
      return String(text).replace(/[&<>"']/g, (m) => map[m]);
    }

    // 1. 방명록 목록 불러오기 (GET)
    async function loadGuestbook() {
      listContainer.innerHTML = `
        <div class="py-12 text-center text-slate-400">
          <div class="inline-block animate-spin rounded-full h-6 w-6 border-b-2 border-indigo-600 mb-2"></div>
          <p class="text-sm">방명록을 불러오는 중입니다...</p>
        </div>
      `;

      try {
        // GAS 웹앱은 302 리다이렉트되므로 redirect: "follow" 적용
        const response = await fetch(GAS_API_URL, {
          method: "GET",
          redirect: "follow"
        });

        const result = await response.json();

        if (result.status === "success") {
          renderList(result.data);
        } else {
          throw new Error(result.message);
        }
      } catch (err) {
        console.error(err);
        listContainer.innerHTML = `
          <div class="p-4 bg-red-50 border border-red-200 text-red-700 rounded-xl text-center text-sm">
            목록을 불러오는 도중 오류가 발생했습니다.
          </div>
        `;
      }
    }

    // 목록 렌더링
    function renderList(items) {
      countBadge.textContent = items.length;

      if (!items || items.length === 0) {
        listContainer.innerHTML = `
          <div class="p-8 text-center bg-white rounded-xl border border-dashed border-slate-300 text-slate-500 text-sm">
            아직 등록된 방명록이 없습니다. 첫 글을 남겨보세요!
          </div>
        `;
        return;
      }

      listContainer.innerHTML = items.map(item => `
        <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm transition hover:shadow-md">
          <div class="flex items-center justify-between mb-2">
            <span class="font-bold text-slate-800 text-sm">${escapeHtml(item.author)}</span>
            <time class="text-xs text-slate-400">${escapeHtml(item.createdAt)}</time>
          </div>
          <p class="text-slate-600 text-sm whitespace-pre-wrap leading-relaxed">${escapeHtml(item.message)}</p>
        </div>
      `).join("");
    }

    // 2. 방명록 제출 처리 (POST)
    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const author = authorInput.value.trim();
      const message = messageInput.value.trim();

      if (!author || !message) return;

      submitBtn.disabled = true;
      submitBtn.innerHTML = `<span>등록 중...</span>`;

      try {
        /**
         * 💡 CORS preflight(OPTIONS) 우회 팁:
         * Content-Type을 'text/plain;charset=utf-8'로 전송하면 브라우저가
         * Simple Request로 취급하여 CORS 프리플라이트 차단 없이 GAS doPost로 전달됩니다.
         */
        const response = await fetch(GAS_API_URL, {
          method: "POST",
          headers: {
            "Content-Type": "text/plain;charset=utf-8"
          },
          body: JSON.stringify({ author, message }),
          redirect: "follow"
        });

        const result = await response.json();

        if (result.status === "success") {
          // 폼 초기화 및 목록 갱신
          authorInput.value = "";
          messageInput.value = "";
          await loadGuestbook();
        } else {
          alert("등록 실패: " + result.message);
        }
      } catch (err) {
        console.error(err);
        alert("네트워크 오류가 발생했습니다. 다시 시도해주세요.");
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = `<span>방명록 남기기</span>`;
      }
    });

    // 새로고침 버튼 핸들러
    refreshBtn.addEventListener("click", loadGuestbook);

    // 페이지 진입 시 초기 데이터 로드
    loadGuestbook();
  </script>
</body>
</html>
